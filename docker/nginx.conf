# Serves the prebuilt React dashboard on :3000 with SPA fallback.
# Replaces /etc/nginx/nginx.conf inside the all-in-one image.
user www-data;
worker_processes 1;
# Foreground mode comes from the `-g "daemon off;"` flag in supervisord.conf
# (do NOT add `daemon off;` here too - nginx rejects the duplicate).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 3000;
    server_name _;
    root /app/frontend-build;
    index index.html;

    # Container startup rewrites this file from .env; never cache it.
    location = /runtime-config.js {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
