<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef4fc" />
    <meta
      name="description"
      content="Enterprise API Security Auditor - agentic AI security and compliance auditing for Kong API Gateway."
    />
    <title>Enterprise API Security Auditor</title>
    <!-- Docker runtime config (rewritten from .env at container startup;
         ignored for local dev, where REACT_APP_* from frontend/.env wins). -->
    <script src="%PUBLIC_URL%/runtime-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Paint the light-blue plane before React mounts, so there is never a
         white or dark flash on load. */
      html, body, #root { background-color: #eef4fc; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
